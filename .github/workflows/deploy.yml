# Adapted from GitHub's official static Pages starter workflow, checked 2026-09-28.
name: Deploy Peter Wade educational site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate local website files
        run: python3 tools/check_site.py
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload only the public website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
